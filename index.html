<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --card-bg: #f5f5f5;
            --border: #e0e0e0;
            --accent: #1a1a1a;
            --shadow: rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-secondary: #888888;
            --card-bg: #1a1a1a;
            --border: #333333;
            --accent: #e0e0e0;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', 'Noto Serif SC', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .top-actions {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.6rem;
            z-index: 100;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
            position: relative;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .icon-btn.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }
        .settings-panel {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            min-width: 180px;
            box-shadow: 0 10px 40px var(--shadow);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s;
        }

        .settings-panel.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0;
            font-size: 0.85rem;
            color: var(--text);
        }

        .toggle {
            width: 40px;
            height: 22px;
            border-radius: 11px;
            background: var(--border);
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle.on {
            background: var(--text);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }

        .toggle.on::after {
            transform: translateX(18px);
        }

        /* 头像 */
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--text);
            color: var(--bg);
            margin: 0 auto 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 600;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 0.2rem;
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* 一言区域 - 支持滑动 */
        .quote-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quote-block {
            flex: 1;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            position: relative;
            transition: background 0.3s;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            touch-action: pan-y;
            user-select: text;
            -webkit-user-select: text;
            cursor: grab;
        }

        .quote-block:active {
            cursor: grabbing;
        }

        .quote-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text);
            transition: opacity 0.3s, transform 0.3s;
            word-break: break-word;
            overflow-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .quote-text::-webkit-scrollbar {
            width: 4px;
        }

        .quote-text::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .quote-text.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* 左右切换箭头 */
        .arrow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .arrow:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .arrow:active {
            transform: scale(0.9);
        }

        /* 指示器 */
        .quote-dots {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--text);
            width: 18px;
            border-radius: 3px;
        }

        /* 来源标签 */
        .quote-tag {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            opacity: 0.6;
            font-family: 'Inter', sans-serif;
        }

        /* 滑动提示 */
        .swipe-hint {
            position: absolute;
            bottom: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--text-secondary);
            opacity: 0.4;
            pointer-events: none;
        }

        /* 底部分隔线 */
        .divider {
            width: 24px;
            height: 1px;
            background: var(--border);
            margin: 2.5rem auto 0.8rem;
        }

        .footer {
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .quote-block { padding: 1.5rem 1.2rem; min-height: 160px; }
            .quote-text { font-size: 0.95rem; max-height: 250px; }
            h1 { font-size: 1.4rem; }
            .arrow { display: none; }
        }
    </style>
</head>

        // ========== 状态 ==========
        let isAutoPlay = true;
        let usedIndices = new Set();
        let currentIndex = 0;
        let quoteInterval = null;

        // ========== DOM ==========
        const quoteText = document.getElementById('quoteText');
        const quoteTag = document.getElementById('quoteTag');
        const quoteDots = document.getElementById('quoteDots');
        const quoteBlock = document.getElementById('quoteBlock');
        const themeBtn = document.getElementById('themeBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const autoToggle = document.getElementById('autoToggle');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ========== 初始化 ==========
        function initQuotes() {
            usedIndices.clear();
            currentIndex = getRandomIndex();
            showQuote(currentIndex);
            createDots();
            if (isAutoPlay) startAutoPlay();
        }

        // 获取不重复的随机索引
        function getRandomIndex() {
            if (usedIndices.size >= quotes.length) {
                usedIndices.clear();
            }
            let idx;
            do {
                idx = Math.floor(Math.random() * quotes.length);
            } while (usedIndices.has(idx));
            usedIndices.add(idx);
            return idx;
        }

        // 显示一言
        function showQuote(idx) {
            quoteText.classList.add('fade-out');
            
            setTimeout(() => {
                quoteText.textContent = quotes[idx];
                quoteTag.textContent = `${idx + 1}/${quotes.length}`;
                quoteText.classList.remove('fade-out');
                updateDots();
            }, 300);
        }

        // 创建指示器
        function createDots() {
            quoteDots.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                quoteDots.appendChild(dot);
            }
            updateDots();
        }

        // 更新指示器
        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex % 3);
            });
        }

        // 切换一言
        function switchQuote() {
            stopAutoPlay();
            currentIndex = getRandomIndex();
            showQuote(currentIndex);
            if (isAutoPlay) startAutoPlay();
        }

        // 自动播放
        function startAutoPlay() {
            stopAutoPlay();
            quoteInterval = setInterval(() => {
                currentIndex = getRandomIndex();
                showQuote(currentIndex);
            }, 5000);
        }

        function stopAutoPlay() {
            if (quoteInterval) {
                clearInterval(quoteInterval);
                quoteInterval = null;
            }
        }

        // ========== 滑动切换 ==========
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        quoteBlock.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = true;
            stopAutoPlay();
        }, { passive: true });

        quoteBlock.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const diffX = touchStartX - touchX;
            const diffY = touchStartY - touchY;
            
            // 判断是水平滑动还是垂直滚动
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                // 水平滑动，阻止默认行为
                e.preventDefault();
            }
        }, { passive: false });

        quoteBlock.addEventListener('touchend', (e) => {
            if (!isSwiping) return;
            isSwiping = false;
            
            const touchEndX = e.changedTouches[0].clientX;
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - e.changedTouches[0].clientY;
            
            // 必须是水平滑动才切换
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                switchQuote();
            }
            
            if (isAutoPlay) startAutoPlay();
        }, { passive: true });

        // 鼠标拖拽切换（桌面端）
        let mouseStartX = 0;
        let isMouseDown = false;

        quoteBlock.addEventListener('mousedown', (e) => {
            mouseStartX = e.clientX;
            isMouseDown = true;
            stopAutoPlay();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
        });

        document.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const diffX = mouseStartX - e.clientX;
            if (Math.abs(diffX) > 80) {
                switchQuote();
            }
            
            if (isAutoPlay) startAutoPlay();
        });

        // ========== 事件绑定 ==========
        prevBtn.addEventListener('click', () => switchQuote());
        nextBtn.addEventListener('click', () => switchQuote());

        // 设置面板
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                settingsPanel.classList.remove('show');
            }
        });

        // 自动播放开关
        autoToggle.addEventListener('click', () => {
            isAutoPlay = !isAutoPlay;
            autoToggle.classList.toggle('on', isAutoPlay);
            if (isAutoPlay) {
                startAutoPlay();
            } else {
                stopAutoPlay();
            }
        });

        // 日夜切换
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
            themeBtn.textContent = savedTheme === 'dark' ? '☾' : '☀';
        }

        themeBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            themeBtn.textContent = next === 'dark' ? '☾' : '☀';
            localStorage.setItem('theme', next);
        });

        // ========== 启动 ==========
        initQuotes();
    </script>
